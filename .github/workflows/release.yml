# Release verification for the Verse offline HTML build.
#
# Tag push (offline-YYYYMMDD or offline-YYYYMMDD-N): build the offline reader
# with offline/build_offline.py (stdlib only; public-domain editions only:
# kjv, kj16, gen + Hebrew/Greek sources), package it exactly like the
# existing releases (verse-offline-<DATE>.tar.gz and .zip, top-level dist/),
# resolve requirements.txt into a lockfile in a clean venv, then the checks
# below.
#
# Order of checks (nothing is published unless every one passes):
#   1. build-scan: build, SBOM (syft), OSV-Scanner + scripts/osv_gate.py
#      (fails on CVSS >= 7.0; lower scored findings also hold the release;
#      unscored advisories are ::warning:: only), SHA256SUMS written and
#      verified.
#   2. virustotal: optional, only if vars.ENABLE_VIRUSTOTAL == 'true' AND the
#      VT_API_KEY secret is set, and only on a public repo.
#   3. release: re-verifies SHA256SUMS, attests, publishes the release with
#      the scan report and verification.json (badge data).
# If any check fails: nothing is published. Findings go to a workflow
# artifact and the job summary, and the "blocked" job opens or updates the
# issue "Release blocked: <tag> security check failed" (assigned to elcafe7)
# with the findings and a fix prompt. A later clean run publishes and closes it.
#
# workflow_dispatch: dry run of step 1 only. Never attests, publishes or
# opens issues.
#
# Free tools only. Every action is pinned to a full commit SHA.
name: Release (verified)

on:
  push:
    tags:
      - "offline-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SYFT_VERSION: "v1.55.0"
  OSV_SCANNER_VERSION: "v2.7.0"
  # sha256 of osv-scanner_linux_amd64 from the v2.7.0 release's osv-scanner_SHA256SUMS
  OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
  # CVSS score at or above which the release fails (7.0 = High, 9.0 = Critical)
  SEVERITY_THRESHOLD: "7.0"
  PYTHON_VERSION: "3.12"

jobs:
  build-scan:
    name: Build, SBOM, scan, checksums
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      prefix: ${{ steps.meta.outputs.prefix }}
      gate: ${{ steps.scan.outputs.gate }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Work out the release date and tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="offline-$(TZ=America/New_York date +%Y%m%d)"
          fi
          if ! [[ "$tag" =~ ^offline-([0-9]{8})(-[0-9]+)?$ ]]; then
            echo "::error::Tag $tag must look like offline-YYYYMMDD or offline-YYYYMMDD-N"
            exit 1
          fi
          date="${BASH_REMATCH[1]}"
          {
            echo "tag=$tag"
            echo "date=$date"
            echo "title=Verse Offline ${date:0:4}-${date:4:2}-${date:6:2}"
            echo "prefix=verse-offline-$date"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Python dependencies into a lockfile (clean venv) and run tests
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
        run: |
          # requirements.txt has ranges, not pins, so record exactly what a clean
          # install resolves today. The offline bundle itself has no dependencies;
          # this covers the web app and CLI in the same repo.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -r requirements.txt
          mkdir -p dist
          "$RUNNER_TEMP/venv/bin/python" -m pip freeze > "dist/${PREFIX}-requirements.lock.txt"
          cat "dist/${PREFIX}-requirements.lock.txt"
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -v
          echo "OSV_LOCKFILES=requirements.txt:dist/${PREFIX}-requirements.lock.txt" >> "$GITHUB_ENV"

      - name: Build the offline reader and package it
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
        run: |
          python3 offline/build_offline.py
          # Same layout as earlier releases: one top-level dist/ folder.
          epoch="$(git log -1 --format=%ct)"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" \
            -C offline -cf - dist | gzip -n > "dist/${PREFIX}.tar.gz"
          (cd offline && find dist -exec touch -d "@${epoch}" {} + && find dist | sort | zip -qX -@ "../dist/${PREFIX}.zip")
          ls -l dist

      - name: Stage SBOM input (offline bundle + resolved lockfile)
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
        run: |
          mkdir -p "$RUNNER_TEMP/sbom-root"
          cp -r offline/dist "$RUNNER_TEMP/sbom-root/offline"
          cp "dist/${PREFIX}-requirements.lock.txt" "$RUNNER_TEMP/sbom-root/requirements.lock.txt"
          echo "SBOM_ROOT=$RUNNER_TEMP/sbom-root" >> "$GITHUB_ENV"

      - name: Release notes intro
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
        run: |
          mkdir -p notes
          cat > notes/intro.md <<EOF
          Fully-offline reader: KJV + KJ1611 with Apocrypha + Geneva 1599 with Apocrypha + Hebrew/Greek sources with transliteration. No dependencies, no internet needed.

          Unpack and open dist/index.html (works over file://):

              tar -xzf ${PREFIX}.tar.gz
              xdg-open dist/index.html

          No tar? Use ${PREFIX}.zip instead.
          EOF

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ env.SBOM_ROOT }}
          format: cyclonedx-json
          output-file: dist/${{ steps.meta.outputs.prefix }}.cdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Self-test the OSV severity gate
        run: python3 -m unittest -v tests.test_osv_gate

      - name: Install OSV-Scanner (checksum-verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      - name: Scan with OSV-Scanner and gate on the result
        id: scan
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          mkdir -p scan-report
          args=()
          for lock in $OSV_LOCKFILES; do args+=(-L "$lock"); done
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source "${args[@]}" -L "dist/${PREFIX}.cdx.json" \
            --format json --output-file "dist/${PREFIX}-osv-scan.json"
          rc=$?
          set -e
          # 0 = no vulns, 1 = vulns found (gated below), anything else = scanner error
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::OSV-Scanner failed with exit code $rc"
            exit "$rc"
          fi
          python3 scripts/osv_gate.py \
            "dist/${PREFIX}-osv-scan.json" \
            "dist/${PREFIX}-osv-scan.md" \
            --threshold "$SEVERITY_THRESHOLD" \
            --title "${PREFIX} OSV-Scanner report" \
            --badge-json dist/verification.json \
            --report-url "${SERVER_URL}/${REPO}/releases/download/${TAG}/${PREFIX}-osv-scan.md" \
            --tool-version "${OSV_SCANNER_VERSION#v}" \
            --release "$TAG" \
            --repository "$REPO" && gate=pass || gate=fail
          cp "dist/${PREFIX}-osv-scan.json" "dist/${PREFIX}-osv-scan.md" scan-report/
          cat "dist/${PREFIX}-osv-scan.md" >> "$GITHUB_STEP_SUMMARY"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

      - name: Write and verify SHA256SUMS
        if: steps.scan.outputs.gate == 'pass'
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Keep the scan report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report
          path: scan-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Keep release files as a workflow artifact (clean scan only)
        if: steps.scan.outputs.gate == 'pass'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Keep release notes as a workflow artifact
        if: steps.scan.outputs.gate == 'pass'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          if-no-files-found: error
          retention-days: 14

      - name: Stop on findings (nothing is published)
        if: steps.scan.outputs.gate != 'pass'
        run: |
          echo "::error::OSV-Scanner found vulnerabilities. Nothing will be published. See the job summary (Suggested fix) and the scan-report artifact."
          exit 1

  virustotal:
    name: VirusTotal (optional)
    needs: build-scan
    if: github.event_name == 'push' && vars.ENABLE_VIRUSTOTAL == 'true' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.vt.outputs.ran }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Verify SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # Public files only: this job runs only on a public repo, and only on
      # the files that the release below would publish.
      - name: Scan with VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          mkdir -p vt-report
          if [ -z "$VT_API_KEY" ]; then
            echo "VT_API_KEY is not set; VirusTotal stays off." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          set +e
          bash scripts/virustotal_check.sh vt-report/virustotal.md dist/verse-offline-*.tar.gz dist/verse-offline-*.zip
          rc=$?
          set -e
          cat vt-report/virustotal.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Keep the VirusTotal report as a workflow artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virustotal-report
          path: vt-report/
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Attest and publish
    needs: [build-scan, virustotal]
    if: >-
      !cancelled() && github.event_name == 'push' &&
      needs.build-scan.result == 'success' && needs.build-scan.outputs.gate == 'pass' &&
      (needs.virustotal.result == 'success' || needs.virustotal.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # Sigstore signing for attestations
      attestations: write  # store attestations
      issues: write        # close a matching "Release blocked" issue
    env:
      TAG: ${{ needs.build-scan.outputs.tag }}
      TITLE: ${{ needs.build-scan.outputs.title }}
      PREFIX: ${{ needs.build-scan.outputs.prefix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      - name: Re-verify SHA256SUMS before publishing
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Check the scan passed and the badge data says so
        run: |
          test -f dist/verification.json
          jq -e '.result == "pass" and .known_vulnerabilities == 0' dist/verification.json

      # Artifact attestations are free on public repos. On a private repo
      # they need GitHub Enterprise Cloud; set vars.ATTESTATIONS_AVAILABLE
      # to 'true' only if that applies.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public' || vars.ATTESTATIONS_AVAILABLE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest SBOM
        if: github.event.repository.visibility == 'public' || vars.ATTESTATIONS_AVAILABLE == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/verse-offline-*.tar.gz
          sbom-path: dist/${{ env.PREFIX }}.cdx.json

      - name: Write release notes
        env:
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VT_RAN: ${{ needs.virustotal.outputs.ran }}
          ATTESTED: ${{ github.event.repository.visibility == 'public' || vars.ATTESTATIONS_AVAILABLE == 'true' }}
        run: |
          {
            cat notes/intro.md
            echo
            echo "## Verification"
            echo
            echo "Built and scanned by [this workflow run](${RUN_URL}) on $(jq -r .date dist/verification.json): OSV-Scanner $(jq -r .tool_version dist/verification.json), 0 known vulnerabilities."
            echo
            echo "- \`SHA256SUMS\`: checksums for every file in this release (\`sha256sum -c --ignore-missing SHA256SUMS\`)"
            echo "- \`${PREFIX}.cdx.json\`: CycloneDX SBOM"
            echo "- \`${PREFIX}-osv-scan.json\` / \`.md\`: OSV-Scanner report for the date above"
            echo "- \`verification.json\`: scan summary (tool, date, result, report link) for download pages"
            if [ "$ATTESTED" = "true" ]; then
              echo "- Provenance: \`gh attestation verify <file> -R ${REPO}\`"
            fi
            if [ "$VT_RAN" = "true" ]; then
              echo "- VirusTotal: checked before publishing (links in the workflow run summary)"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Close any "Release blocked" issue for this tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/release_unblocked.sh "$TAG"

  blocked:
    name: Report blocked release
    needs: [build-scan, virustotal, release]
    if: >-
      always() && github.event_name == 'push' &&
      (contains(needs.*.result, 'failure') || needs.build-scan.outputs.gate == 'fail')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write  # open or update the "Release blocked" issue
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download scan reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: "*-report"
          path: reports
          merge-multiple: true

      - name: Open or update the "Release blocked" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Prefer the validated build-scan tag; fall back to ref_name (script allowlists).
          TAG: ${{ needs.build-scan.outputs.tag || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_JOBS: "build-scan: ${{ needs.build-scan.result }} (scan ${{ needs.build-scan.outputs.gate || 'not run' }}), virustotal: ${{ needs.virustotal.result }}, release: ${{ needs.release.result }}"
        run: |
          mkdir -p reports
          rm -f reports/*.json
          bash scripts/release_blocked_issue.sh "$TAG" reports
