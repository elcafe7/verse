# Verse browser reader. The trailing slash is canonical because the app uses
# relative API URLs beneath this mount point.
location = /verse {
    return 308 /verse/;
}

# API: the harvestable surface gets the tight bucket. Longer prefix wins over
# /verse/ below for these paths. Zones in conf.d/verse-ratelimit.conf.
location ^~ /verse/api/ {
    limit_req zone=verse_api burst=8 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /verse;
    proxy_pass http://127.0.0.1:8769/api/;
}

location = /verse/health {
    limit_req zone=verse_api burst=8 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /verse;
    proxy_pass http://127.0.0.1:8769/health;
}

location ^~ /verse/ {
    # Generous page bucket (landing + static assets).
    limit_req zone=verse_page burst=20 nodelay;
    limit_req_status 429;
    limit_req_log_level warn;

    client_max_body_size 16k;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /verse;
    proxy_pass http://127.0.0.1:8769/;
}
