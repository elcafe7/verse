# Anti-scrape rate limiting for the public Verse reader (poeta.icu/verse/).
# Key = last X-Forwarded-For hop, else the direct peer (text form!):
#   - via Cloudflare: CF appends the true client IP last (unspoofable tail)
#   - via cPanel PHP proxy: single XFF holding the visitor IP
#   - direct: peer address (XFF tail is client-controlled there; the port-80
#     backdoor is temporary, and bulk harvesters use the HTTPS front door)
map $http_x_forwarded_for $verse_client_key {
    default                $remote_addr;
    "~(?P<last>[^,\\s]+)\\s*$" $last;
}

# Localhost health checks / smoke tests bypass limits (empty key = no limit).
map $verse_client_key $verse_limit_key {
    default     $verse_client_key;
    "127.0.0.1" "";
    "::1"         "";
}

# API (the harvestable surface): ~1 req / 2s sustained, 8-burst for fast paging.
limit_req_zone $verse_limit_key zone=verse_api:10m rate=30r/m;
# Reader page + static assets: 1 req / s sustained, 20-burst.
limit_req_zone $verse_limit_key zone=verse_page:10m rate=60r/m;
